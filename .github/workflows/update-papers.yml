name: Update Publications from Google Scholar

on:
  schedule:
    # Run every Sunday at 6:00 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    # Allow manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install scholarly pyyaml requests

      - name: Run publication update script
        run: python scripts/update_papers.py
        env:
          SCHOLAR_ID: "WXsYVfsAAAAJ"
          # Optional: set SERPAPI_KEY secret in repo settings for more reliable scraping
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      - name: Commit updated publications
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add _data/publications.yml
          if git diff --staged --quiet; then
            echo "No changes to publications."
          else
            git commit -m "Auto-update publications from Google Scholar [skip ci]"
            git push
          fi
