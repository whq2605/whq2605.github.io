<nav class="navbar">
  <div class="navbar-inner">
    <a class="navbar-brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>

    <button class="navbar-toggle" id="nav-toggle" aria-label="Toggle navigation">&#9776;</button>

    <ul class="navbar-nav" id="nav-menu">
      {% for link in site.nav_links %}
      <li>
        <a class="nav-link{% if page.url == link.url %} active{% endif %}" href="{{ link.url | relative_url }}">
          {{ link.title }}
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>
</nav>

<script>
  document.getElementById('nav-toggle').addEventListener('click', function() {
    document.getElementById('nav-menu').classList.toggle('open');
  });
</script>
